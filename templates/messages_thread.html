{% extends "base.html" %}
{% block title %}Chat with {{ other.name }} - AlumniMS{% endblock %}
{% block content %}
<a href="{{ url_for('messages_inbox') }}" class="btn btn-sm btn-outline-secondary mb-3"><i class="bi bi-arrow-left"></i> Inbox</a>
<div class="card p-4">
  <h5 class="mb-3">Conversation with {{ other.name }}</h5>
  <div class="mb-3" style="max-height:420px; overflow-y:auto;">
    {% for m in thread %}
      <div class="d-flex {{ 'justify-content-end' if m.sender_id == my_id else 'justify-content-start' }} mb-2">
        <div class="p-2 rounded-3 {{ 'bg-primary text-white' if m.sender_id == my_id else 'bg-light border' }}" style="max-width:70%;">
          <div>{{ m.body }}</div>
          <div class="small {{ 'text-white-50' if m.sender_id == my_id else 'text-muted' }}">{{ m.created_at }}</div>
        </div>
      </div>
    {% else %}
      <p class="text-muted">No messages yet. Say hello!</p>
    {% endfor %}
  </div>
  <form method="post" class="d-flex gap-2">
    <input type="text" name="body" class="form-control" placeholder="Type a message..." required autofocus>
    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Send</button>
  </form>
</div>
{% endblock %}

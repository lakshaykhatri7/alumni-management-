{% extends "base.html" %}
{% block title %}Create Event - AlumniMS{% endblock %}
{% block content %}
<h2 class="mb-4">Create Event</h2>
<div class="card p-4" style="max-width:600px;">
<form method="post">
  <div class="mb-3"><label class="form-label">Title *</label><input required name="title" class="form-control"></div>
  <div class="mb-3"><label class="form-label">Description</label><textarea id="desc" name="description" class="form-control" rows="3"></textarea></div>
  <div class="mb-3"><label class="form-label">Date</label><input id="edate" type="date" name="event_date" class="form-control"></div>
  <div class="mb-3"><label class="form-label">Location</label><input id="eloc" name="location" class="form-control"></div>
  <button type="button" id="genDescBtn" class="btn btn-outline-secondary btn-sm mb-3" onclick="genDesc()"><i class="bi bi-robot"></i> AI: write description from title</button>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="notify" value="1" id="notifyCheck" {{ '' if mail_on else 'disabled' }}>
    <label class="form-check-label" for="notifyCheck">
      Email all alumni about this event {{ '' if mail_on else '(configure MAIL_USERNAME/MAIL_PASSWORD in .env to enable)' }}
    </label>
  </div>
  <div><button class="btn btn-primary">Create</button>
  <a href="{{ url_for('events_list') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
<script>
async function genDesc() {
  const title = document.querySelector('[name=title]').value;
  if (!title) { alert('Enter title first'); return; }
  const btn = document.getElementById('genDescBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  const originalBtnHtml = btn.innerHTML;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Generating...';
  try {
    const res = await fetch('/ai/generate/event', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title, bullets:title, location: document.getElementById('eloc').value, date: document.getElementById('edate').value})
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    document.getElementById('desc').value = data.text;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalBtnHtml;
  }
}
</script>
{% endblock %}
